<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>فانوس — بلاگ</title>
  <meta name="description" content="بلاگ فانوس — خواندن پست">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Estedad:wght@400;500;600;700&family=Vazirmatn:wght@300;400;500;700&display=swap" rel="stylesheet">
  <link href="https://v1.fontapi.ir/css/Vazirmatn" rel="stylesheet">
  <link href="https://v1.fontapi.ir/css/Estedad" rel="stylesheet">

  <!-- Highlight.js Theme (switched by JS) -->
  <link id="hljs-theme" rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/styles/github.min.css">

  <!-- Styles -->
  <link rel="stylesheet" href="css/style.css">

  <!-- Vercel Web Analytics -->
  <script>
    window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
    window.va('beforeSend', function(event) {
      try {
        var url = new URL(event.url);
        if (url.pathname.endsWith('/post.html')) {
          var slug = url.searchParams.get('slug');
          if (slug) {
            url.pathname = '/posts/' + slug;
          }
        } else if (url.pathname.endsWith('/index.html') || url.pathname === '/') {
          var tag = url.searchParams.get('tag');
          if (tag) {
            url.pathname = '/tags/' + tag;
          }
        }
        event.url = url.toString();
        return event;
      } catch (err) {
        return event;
      }
    });
  </script>
  <script defer src="/_vercel/insights/script.js"></script>

  <!-- Vercel Speed Insights -->
  <script>
    window.si = window.si || function () { (window.siq = window.siq || []).push(arguments); };
  </script>
  <script defer src="/_vercel/speed-insights/script.js"></script>
</head>
<body>

  <header class="site-header">
    <div class="container">
      <a href="./" class="site-title">🏮 بلاگ فانوس</a>
      <button id="theme-toggle" class="theme-toggle" aria-label="تغییر تم">🌙</button>
    </div>
  </header>

  <main>
    <div class="container">
      <a href="./" class="back-link">→ بازگشت به بلاگ</a>

      <article>
        <header id="post-header" class="post-header">
          <p class="loading">در حال بارگذاری...</p>
        </header>

        <div id="post-content" class="markdown-body">
        </div>

        <!-- Share Section -->
        <div id="post-share" class="post-share" style="display: none;">
          <hr class="share-divider">
          <div class="share-container">
            <span class="share-title">اشتراک‌گذاری مقاله:</span>
            <button id="share-btn" class="share-btn" aria-label="کپی کردن لینک">
              <span class="share-icon">🔗</span>
              <span class="share-text">کپی کردن لینک</span>
            </button>
          </div>
        </div>
      </article>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>ساخته شده با 💙 و مارک‌داون</p>
    </div>
  </footer>

  <!-- markdown-it -->
  <script src="https://cdn.jsdelivr.net/npm/markdown-it@14.1.0/dist/markdown-it.min.js"></script>
  <!-- Highlight.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/highlight.min.js"></script>
  <!-- App -->
  <script src="js/app.js"></script>

</body>
</html>
